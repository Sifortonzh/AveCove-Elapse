name: Deploy to own server

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build production image on GitHub
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL=https://allo.avecrouge.top \
            --tag "allo-app:${GITHUB_SHA}" .
          docker save "allo-app:${GITHUB_SHA}" | gzip -1 > "/tmp/allo-app-${GITHUB_SHA}.tar.gz"
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Upload source
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          rsync -az --delete --exclude '.env' --exclude 'backups' --exclude '.git' \
            -e 'ssh -i ~/.ssh/deploy_key' ./ "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/"
      - name: Upload production image
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            "/tmp/allo-app-${GITHUB_SHA}.tar.gz" \
            "$SERVER_USER@$SERVER_HOST:/tmp/allo-app-${GITHUB_SHA}.tar.gz"
      - name: Load and restart without server-side build
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" \
            "set -eu; \
             gzip -dc '/tmp/allo-app-${GITHUB_SHA}.tar.gz' | docker load; \
             docker tag 'allo-app:${GITHUB_SHA}' allo-app:latest; \
             cd '$SERVER_PATH'; \
             docker compose up -d --no-build --remove-orphans; \
             printf '%s\n' '${GITHUB_SHA}' > .deployed-commit; \
             rm -f '/tmp/allo-app-${GITHUB_SHA}.tar.gz'; \
             docker compose ps"
