# Optional overlay only. Does not alter the existing app/postgres services.
# This base image runs the API/rules worker. OCR requires an operator-prepared worker image.
services:
  forge-api:
    profiles: [forge]
    build: ./forge
    image: elapse-forge:0.1.0
    env_file: ./forge/.env
    environment:
      FORGE_STORAGE_ROOT: /data
      FORGE_CURRICULUM_DIR: /app/forge/curriculums
    ports: ["127.0.0.1:8091:8091"]
    volumes: ["forge_data:/data"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  forge-worker:
    profiles: [forge-worker]
    image: ${FORGE_WORKER_IMAGE:-elapse-forge:0.1.0}
    command: [python, -m, elapse_forge.worker]
    env_file: ./forge/.env
    environment:
      FORGE_STORAGE_ROOT: /data
      FORGE_CURRICULUM_DIR: /app/forge/curriculums
    volumes: ["forge_data:/data"]
    restart: unless-stopped
    # Appropriate only for a lightweight rules/remote worker; benchmark native OCR separately.
    mem_limit: 1g
    cpus: 1
volumes:
  forge_data:
